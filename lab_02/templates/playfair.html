<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <!-- Tiêu đề -->
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">PLAYFAIR CIPHER</td>
            </tr>

            <!-- Phần mã hóa -->
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="playfair-encrypt-form" method="POST" action="playfair/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="playfair-key-encrypt" type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key (letters only)" required>
                            <div id="playfair-encrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <!-- Phần giải mã -->
            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="playfair-decrypt-form" method="POST" action="playfair/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="playfair-key-decrypt" type="text" class="form-control" name="inputKeyCipher" placeholder="Input Key (letters only)" required>
                            <div id="playfair-decrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
    <script>
        function validatePlayfairKey(value) {
            if (!value || value.trim() === '') return false;
            return /^[A-Za-z]+$/.test(value);
        }

        document.getElementById('playfair-encrypt-form').addEventListener('submit', function(e){
            const val = document.getElementById('playfair-key-encrypt').value;
            const ok = validatePlayfairKey(val);
            const errEl = document.getElementById('playfair-encrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be non-empty and contain letters only.';
            } else {
                errEl.style.display = 'none';
            }
        });

        document.getElementById('playfair-decrypt-form').addEventListener('submit', function(e){
            const val = document.getElementById('playfair-key-decrypt').value;
            const ok = validatePlayfairKey(val);
            const errEl = document.getElementById('playfair-decrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be non-empty and contain letters only.';
            } else {
                errEl.style.display = 'none';
            }
        });
    </script>
</body>
</html>
