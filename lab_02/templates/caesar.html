<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <!-- Tiêu đề -->
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">CAESAR CIPHER</td>
            </tr>

            <!-- Phần mã hóa -->
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="caesar-encrypt-form" method="POST" action="caesar/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="caesar-key-encrypt" type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key (1-25)" required>
                            <div id="caesar-encrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <!-- Phần giải mã -->
            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="caesar-decrypt-form" method="POST" action="caesar/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="caesar-key-decrypt" type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key (1-25)" required>
                            <div id="caesar-decrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
    <script>
        function validateCaesarKey(value) {
            if (value === '' || value === null) return false;
            const k = Number(value);
            return Number.isInteger(k) && k >= 1 && k <= 25;
        }

        document.getElementById('caesar-encrypt-form').addEventListener('submit', function(e){
            const val = document.getElementById('caesar-key-encrypt').value;
            const ok = validateCaesarKey(val);
            const errEl = document.getElementById('caesar-encrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be an integer between 1 and 25.';
            } else {
                errEl.style.display = 'none';
            }
        });

        document.getElementById('caesar-decrypt-form').addEventListener('submit', function(e){
            const val = document.getElementById('caesar-key-decrypt').value;
            const ok = validateCaesarKey(val);
            const errEl = document.getElementById('caesar-decrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be an integer between 1 and 25.';
            } else {
                errEl.style.display = 'none';
            }
        });
    </script>
</body>
</html>
