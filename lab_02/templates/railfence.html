<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <!-- Tiêu đề -->
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">RAILFENCE CIPHER</td>
            </tr>

            <!-- Phần mã hóa -->
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="railfence-encrypt-form" method="POST" action="railfence/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="railfence-key-encrypt" type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key (>=2)" required>
                            <div id="railfence-encrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <!-- Phần giải mã -->
            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form id="railfence-decrypt-form" method="POST" action="railfence/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input id="railfence-key-decrypt" type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key (>=2)" required>
                            <div id="railfence-decrypt-error" class="text-danger small mt-1" style="display:none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
    <script>
        function validateRailKey(key, text) {
            if (text == null) return false;
            if (key === '' || key === null) return false;
            const k = Number(key);
            if (!Number.isInteger(k)) return false;
            if (k < 2) return false;
            if (text.length && k >= text.length) return false;
            return true;
        }

        document.getElementById('railfence-encrypt-form').addEventListener('submit', function(e){
            const text = this.querySelector('input[name="inputPlainText"]').value || '';
            const val = document.getElementById('railfence-key-encrypt').value;
            const ok = validateRailKey(val, text);
            const errEl = document.getElementById('railfence-encrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be integer >=2 and less than the length of the text.';
            } else {
                errEl.style.display = 'none';
            }
        });

        document.getElementById('railfence-decrypt-form').addEventListener('submit', function(e){
            const text = this.querySelector('input[name="inputCipherText"]').value || '';
            const val = document.getElementById('railfence-key-decrypt').value;
            const ok = validateRailKey(val, text);
            const errEl = document.getElementById('railfence-decrypt-error');
            if (!ok) {
                e.preventDefault();
                errEl.style.display = 'block';
                errEl.textContent = 'Key must be integer >=2 and less than the length of the text.';
            } else {
                errEl.style.display = 'none';
            }
        });
    </script>
</body>
</html>
